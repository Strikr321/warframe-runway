<header>
  <div class="account">
    @if (auth.user(); as user) {
      @if (user.avatarUrl) {
        <img class="avatar" [src]="user.avatarUrl" alt="" referrerpolicy="no-referrer" />
      }
      <span class="account-name">{{ user.name }}</span>
      <button type="button" class="account-btn" (click)="signOut()">Sign out</button>
    } @else if (auth.status() === 'signed-out') {
      <button type="button" class="account-btn" (click)="signIn()">Sign in</button>
    }
  </div>

  <div class="header-logo">WARFR<span>&#9650;</span>ME</div>
  <div class="header-sub">Fashion Frame Runway</div>
  <div class="header-line"><div class="header-diamond"></div></div>

  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Collection</a
    >
    <a routerLink="/builder" routerLinkActive="active">Builder</a>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<app-toast />
